[workspace]
resolver = "2"
members = [
    "crates/bridge-proto",
    "crates/bridge-core",
    "crates/bridge-storage",
    "crates/bridge-verifier",
    "crates/bridge-engine",
    "crates/bridge-server",
    "crates/bridge-cli",
    "crates/bridge-testkit",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Zcash Private Bridge Contributors"]

[workspace.dependencies]
# Internal crates
bridge-proto = { path = "crates/bridge-proto" }
bridge-core = { path = "crates/bridge-core" }
bridge-storage = { path = "crates/bridge-storage" }
bridge-verifier = { path = "crates/bridge-verifier" }
bridge-engine = { path = "crates/bridge-engine" }
bridge-server = { path = "crates/bridge-server" }
bridge-testkit = { path = "crates/bridge-testkit" }

# Async & Networking
tokio = { version = "1.43", features = ["full"] }
tokio-stream = "0.1"
tonic = { version = "0.12", features = ["tls", "tls-roots", "tls-webpki-roots"] }
prost = "0.13"
prost-types = "0.13"

# Cryptography & Hashing
blake2b_simd = "1.0"
hex = "0.4"
sha2 = "0.10"
ripemd = "0.1"
zebra-chain = "14.0.0"

# Database
rusqlite = { version = "0.32", features = ["bundled", "backup", "chrono"] }

# Serialization & Config
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# CLI & Telemetry
clap = { version = "4.5", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
anyhow = "1.0"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }

# Testing
tempfile = "3"
